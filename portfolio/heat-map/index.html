<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wubba Lubba Dub Dub — Rick and Morty Episode Ratings</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #070b14;
        --lab: #0d1b2a;
        --portal: #97ce4c;
        --portal-deep: #39ff14;
        --rick: #44c8f5;
        --morty: #f8e71c;
        --pickle: #2d6a4f;
        --mud: #8b5a2b;
        --ink: #e8f7ff;
        --muted: #8aa4b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Share Tech Mono", ui-monospace, monospace;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(68, 200, 245, 0.18), transparent 55%),
          radial-gradient(circle at 85% 70%, rgba(151, 206, 76, 0.16), transparent 40%),
          radial-gradient(circle at 10% 80%, rgba(248, 231, 28, 0.08), transparent 35%),
          linear-gradient(180deg, #050810 0%, #0d1b2a 45%, #071018 100%);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1px 1px at 20% 30%, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(1px 1px at 70% 20%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1.5px 1.5px at 40% 70%, rgba(151, 206, 76, 0.5), transparent),
          radial-gradient(1px 1px at 90% 50%, rgba(68, 200, 245, 0.45), transparent),
          radial-gradient(1px 1px at 15% 85%, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1px 1px at 55% 40%, rgba(255, 255, 255, 0.3), transparent);
        opacity: 0.7;
        z-index: 0;
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: 980px;
        margin: 0 auto;
        padding: 36px 20px 64px;
      }

      .hero {
        text-align: center;
        margin-bottom: 8px;
      }

      .kicker {
        display: inline-block;
        font-family: "Bangers", system-ui, sans-serif;
        letter-spacing: 0.18em;
        font-size: 0.85rem;
        color: var(--portal);
        text-shadow: 0 0 12px rgba(151, 206, 76, 0.55);
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-family: "Luckiest Guy", system-ui, sans-serif;
        font-size: clamp(2rem, 6vw, 3.4rem);
        line-height: 1.05;
        color: var(--rick);
        -webkit-text-stroke: 2px #031018;
        paint-order: stroke fill;
        text-shadow:
          3px 3px 0 #031018,
          0 0 24px rgba(68, 200, 245, 0.45);
      }

      .dek {
        max-width: 38rem;
        margin: 14px auto 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .dek strong {
        color: var(--morty);
        font-weight: 400;
      }

      .portal-gun {
        display: block;
        width: min(200px, 58vw);
        height: auto;
        margin: 18px auto 6px;
        filter: drop-shadow(0 0 14px rgba(151, 206, 76, 0.45));
      }

      .portal-gun .glow {
        transform-origin: 28px 42px;
        animation: portal-pulse 1.8s ease-in-out infinite;
      }

      .portal-gun .muzzle-core {
        animation: muzzle-flicker 1.2s ease-in-out infinite;
      }

      @keyframes portal-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.12);
        }
      }

      @keyframes muzzle-flicker {
        0%,
        100% {
          opacity: 0.85;
        }
        50% {
          opacity: 1;
        }
      }

      .chart-shell {
        margin-top: 18px;
        padding: 18px 12px 10px;
        border: 2px solid rgba(151, 206, 76, 0.45);
        background: linear-gradient(180deg, rgba(13, 27, 42, 0.92), rgba(7, 11, 20, 0.95));
        box-shadow:
          0 0 0 4px rgba(3, 16, 24, 0.8),
          0 0 40px rgba(68, 200, 245, 0.12);
        overflow-x: auto;
      }

      #chart-container {
        display: flex;
        justify-content: center;
        min-width: min-content;
      }

      .cell {
        stroke: rgba(7, 11, 20, 0.85);
        stroke-width: 2;
        cursor: pointer;
        transition: filter 0.15s ease, stroke 0.15s ease;
      }

      .cell:hover,
      .cell.is-hot {
        filter: brightness(1.18) saturate(1.15);
        stroke: var(--morty);
        stroke-width: 2.5;
      }

      .axis-label {
        fill: var(--muted);
        font-family: "Share Tech Mono", monospace;
        font-size: 11px;
      }

      .title-text {
        font-family: "Luckiest Guy", cursive;
        fill: var(--rick);
        stroke: #031018;
        stroke-width: 1.25px;
        paint-order: stroke fill;
      }

      .subtitle-text {
        fill: var(--muted);
        font-family: "Share Tech Mono", monospace;
        font-size: 12px;
      }

      .anno-text {
        fill: var(--portal);
        font-family: "Bangers", sans-serif;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .footer-note {
        text-align: center;
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .footer-note a {
        color: var(--rick);
      }

      .tooltip {
        position: absolute;
        z-index: 20;
        width: 230px;
        padding: 12px 12px 10px;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(160deg, #102536, #0a1622);
        border: 2px solid var(--portal);
        box-shadow:
          0 0 0 3px #031018,
          0 0 22px rgba(151, 206, 76, 0.35);
        font-family: "Share Tech Mono", monospace;
        color: var(--ink);
      }

      .tooltip .ep {
        font-family: "Bangers", sans-serif;
        letter-spacing: 0.06em;
        color: var(--rick);
        font-size: 0.95rem;
        margin-bottom: 4px;
      }

      .tooltip .title {
        font-size: 0.92rem;
        color: var(--morty);
        margin-bottom: 8px;
        line-height: 1.25;
      }

      .tooltip .rating {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .tooltip .rating strong {
        color: var(--portal-deep);
        font-size: 1.15rem;
        text-shadow: 0 0 10px rgba(57, 255, 20, 0.45);
      }

      @media (max-width: 700px) {
        .page {
          padding: 24px 10px 48px;
        }

        h1 {
          -webkit-text-stroke: 1.5px #031018;
        }
      }
    </style>
  </head>

      function render() {
        const container = d3.select("#chart-container");
        container.select("svg").remove();

        const data = DATA;
        const maxSeason = 9;
        const maxEpisode = 11;
        const size = window.innerWidth < 700 ? 36 : 48;
        const margin = {
          top: 70,
          right: window.innerWidth < 700 ? 16 : 90,
          bottom: 90,
          left: 86,
        };
        const width = size * maxEpisode;
        const height = size * maxSeason;

        const svgRoot = container
          .append("svg")
          .attr("width", width + margin.left + margin.right)
          .attr("height", height + margin.top + margin.bottom)
          .attr("role", "img")
          .attr("aria-label", "Heatmap of Rick and Morty IMDb ratings by season and episode");

        const svg = svgRoot
          .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);

        const xScale = d3
          .scaleBand()
          .domain(d3.range(1, maxEpisode + 1))
          .range([0, width])
          .padding(0.12);

        const yScale = d3
          .scaleBand()
          .domain(d3.range(1, maxSeason + 1))
          .range([0, height])
          .padding(0.12);

        // Same readable pattern as the original chart: mud → pale mint → deep teal
        const colorScale = d3
          .scaleLinear()
          .domain([4.5, 7.1, 9.3])
          .range(["#b47c34", "#e0f3f3", "#005f4f"]);

        const tooltip = d3.select("#tooltip");

        // Axis titles: EP above the columns; SEASON centered along the left
        svg
          .append("text")
          .attr("class", "axis-label")
          .attr("x", 0)
          .attr("y", -28)
          .attr("text-anchor", "start")
          .text("EP →");

        svg
          .append("text")
          .attr("class", "axis-label")
          .attr("text-anchor", "middle")
          .attr("dominant-baseline", "middle")
          .attr("transform", `translate(-38, ${20}) rotate(-90)`)
          .text("← SEASON");

        svg
          .selectAll(".x-tick")
          .data(d3.range(1, maxEpisode + 1))
          .enter()
          .append("text")
          .attr("class", "axis-label")
          .attr("x", (d) => xScale(d) + xScale.bandwidth() / 2)
          .attr("y", -8)
          .attr("text-anchor", "middle")
          .text((d) => d);

        svg
          .selectAll(".y-tick")
          .data(d3.range(1, maxSeason + 1))
          .enter()
          .append("text")
          .attr("class", "axis-label")
          .attr("x", -12)
          .attr("y", (d) => yScale(d) + yScale.bandwidth() / 2 + 4)
          .attr("text-anchor", "end")
          .text((d) => `S${d}`);

        const cells = svg
          .selectAll(".cell")
          .data(data)
          .enter()
          .append("rect")
          .attr("class", "cell")
          .attr("x", (d) => xScale(+d.episode))
          .attr("y", (d) => yScale(+d.season))
          .attr("width", xScale.bandwidth())
          .attr("height", yScale.bandwidth())
          .attr("rx", 4)
          .attr("ry", 4)
          .attr("fill", (d) => colorScale(+d.imdb_rating))
          .attr("opacity", 0)
          .on("mouseover", function (event, d) {
            d3.select(this).classed("is-hot", true);
            tooltip
              .style("opacity", 1)
              .html(
                `<div class="ep">S${d.season} · E${d.episode}</div>
                 <div class="title">${d.title}</div>
                 <div class="rating">IMDb <strong>${d.imdb_rating}</strong></div>`
              )
              .style("left", event.pageX + 14 + "px")
              .style("top", event.pageY - 20 + "px");
          })
          .on("mousemove", function (event) {
            tooltip
              .style("left", event.pageX + 14 + "px")
              .style("top", event.pageY - 20 + "px");
          })
          .on("mouseout", function () {
            d3.select(this).classed("is-hot", false);
            tooltip.style("opacity", 0);
          });

        cells
          .transition()
          .duration(500)
          .delay((d, i) => Math.min(i * 8, 600))
          .attr("opacity", 1);

        // Divide classic era / later chaos after season 4
        const divideY = yScale(5);
        svg
          .append("line")
          .attr("x1", -4)
          .attr("x2", width + 4)
          .attr("y1", divideY)
          .attr("y2", divideY)
          .attr("stroke", "#f8e71c")
          .attr("stroke-width", 2)
          .attr("stroke-dasharray", "5 4")
          .attr("opacity", 0.85);

        if (margin.right > 40) {
          svg
            .append("text")
            .attr("class", "anno-text")
            .attr("x", width + 10)
            .attr("y", divideY + 4)
            .text("post-S4 chaos →");
        } else {
          svg
            .append("text")
            .attr("class", "anno-text")
            .attr("x", width - 4)
            .attr("y", divideY - 6)
            .attr("text-anchor", "end")
            .text("post-S4 chaos");
        }

        // Legend
        const legendWidth = Math.min(280, width * 0.7);
        const legendHeight = 12;
        const legend = svg
          .append("g")
          .attr("transform", `translate(${(width - legendWidth) / 2},${height + 28})`);

        const gradient = legend
          .append("defs")
          .append("linearGradient")
          .attr("id", "rmLegend");

        [
          { offset: "0%", color: "#b47c34" },
          { offset: "50%", color: "#e0f3f3" },
          { offset: "100%", color: "#005f4f" },
        ].forEach((stop) => {
          gradient
            .append("stop")
            .attr("offset", stop.offset)
            .attr("stop-color", stop.color);
        });

        legend
          .append("rect")
          .attr("width", legendWidth)
          .attr("height", legendHeight)
          .attr("rx", 3)
          .style("fill", "url(#rmLegend)")
          .attr("stroke", "rgba(224,243,243,0.35)");

        legend
          .append("text")
          .attr("class", "axis-label")
          .attr("x", 0)
          .attr("y", legendHeight + 16)
          .attr("text-anchor", "start")
          .text("4.5");

        legend
          .append("text")
          .attr("class", "axis-label")
          .attr("x", legendWidth)
          .attr("y", legendHeight + 16)
          .attr("text-anchor", "end")
          .text("9.8");

        legend
          .append("text")
          .attr("x", legendWidth / 2)
          .attr("y", legendHeight + 34)
          .attr("text-anchor", "middle")
          .attr("fill", "#44c8f5")
          .attr("font-family", "Bangers, sans-serif")
          .attr("font-size", 14)
          .attr("letter-spacing", "0.06em")
          .text("IMDb RATING");
      }

      render();
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 160);
      });
    </script>
  </body>
</html>
